<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prochekt_Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <h1 style="color:red; text-align:center; padding:20px; background:yellow;">
        TEST BASE.HTML — ФАЙЛ ОБНОВЛЁН
    </h1>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Prochekt_Web</a>
            <a class="nav-link text-light" href="{{ url_for('tasks.list_tasks') }}">Задачи</a>
            {% if current_user.is_authenticated and current_user.role.value == 'Администратор' %}
            <a class="nav-link text-warning" href="{{ url_for('tasks.admin_panel') }}">👑 Админ-панель</a>
            {% endif %}
            <div class="ms-auto">
                {% if current_user.is_authenticated %}
                    <a class="nav-link text-light" href="{{ url_for('main.dashboard') }}">Кабинет</a>
                    <a class="nav-link text-danger" href="{{ url_for('auth.logout') }}">Выйти</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
