<div class="mt-4">
    {% if current_user.id == task.executor_id and task.status.value == 'Принята' %}
        <a href="{{ url_for('tasks.complete_task', task_id=task.id) }}" class="btn btn-warning btn-lg">
            Отметить как выполненную
        </a>
    {% endif %}

    {% if current_user.id == task.customer_id and task.status.value == 'Выполнена' %}
        <a href="{{ url_for('tasks.confirm_task', task_id=task.id) }}" class="btn btn-success btn-lg">
            ✅ Подтвердить выполнение и перечислить награду
        </a>
    {% endif %}
</div>
